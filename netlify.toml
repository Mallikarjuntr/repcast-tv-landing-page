# Plain static site: no build step, served from the repository root.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Friendly paths for the store listing and the app.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Short link the TV's QR code opens: /go?code=1234 → the phone camera page (GitHub Pages).
# 302, not 301, so phones don't cache it if the camera page moves. Netlify keeps the query string.
[[redirects]]
  from = "/go"
  to = "https://mallikarjuntr.github.io/spotter-tv-app/"
  status = 302
  force = true
