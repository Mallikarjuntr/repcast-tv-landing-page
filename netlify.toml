# Plain static site: no build step, served from the repository root.
[build]
  publish = "."

# The site's own pages get a strict policy: no scripts, no camera. It is listed path by path
# because Netlify combines every matching rule, and /camera/ must not inherit it.
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/privacy"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/terms"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/terms.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The phone camera page needs scripts, WebAssembly, the camera, the model download and the
# backend's sockets; it sets none of these limits on GitHub Pages either.
[[headers]]
  for = "/camera/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Friendly paths for the store listing and the app.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# The phone camera page is built and published by repcast-tv-app on GitHub Pages and served here
# at /camera/ (a proxy, status 200), so phones stay on repcast.netlify.app — the backend's CORS list
# allows this origin. Its build uses relative paths, so it works under /camera/ unchanged. If
# Netlify is ever down, the same page is at https://mallikarjuntr.github.io/repcast-tv-app/.
[[redirects]]
  from = "/camera/*"
  to = "https://mallikarjuntr.github.io/repcast-tv-app/:splat"
  status = 200
  force = true

# Short link the TV's QR code opens: /go?code=1234 → /camera/?code=1234 (Netlify keeps the query
# string). 302, not 301, so phones don't cache it.
[[redirects]]
  from = "/go"
  to = "/camera/"
  status = 302
  force = true

# Short link to type on a Fire TV (Downloader app): /apk → the TV app's APK on the GitHub release.
[[redirects]]
  from = "/apk"
  to = "https://github.com/Mallikarjuntr/repcast-tv-app/releases/download/v1.0.0/RepCast-1.0.0.apk"
  status = 302
  force = true
